name: Security Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/fitmate-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/fitmate-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # js-cookie 高危来自 @vue/test-utils 的 dev 传递依赖，生产构建不包含
      - name: npm audit (high and above, production only)
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org/
