name: Build and Push Docker Image

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/fitmate-frontend/**'
      - 'compose*.yaml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

# 推送 GHCR 需要仓库级 packages: write（仅 job 级有时不够）
permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR 镜像名必须全小写，FitMate 等大写仓库名会导致 push 秒失败
      - name: Set GHCR image prefix (lowercase)
        id: image
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/backend:latest
            ${{ steps.image.outputs.prefix }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.image.outputs.prefix }}/backend:latest
          severity: CRITICAL,HIGH
          exit-code: '0'

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set GHCR image prefix (lowercase)
        id: image
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/fitmate-frontend
          file: ./frontend/fitmate-frontend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/frontend:latest
            ${{ steps.image.outputs.prefix }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.image.outputs.prefix }}/frontend:latest
          severity: CRITICAL,HIGH
          exit-code: '0'
