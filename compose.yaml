# FitMate 开发环境：热重载 + MySQL 持久化
# 使用：复制 .env.example 为 .env 后执行 docker compose up -d

services:
  db:
    image: mysql:8.0
    container_name: fitmate-mysql
    restart: unless-stopped
    environment:
      # 与旧版 docker-compose 一致，避免已有 mysql_data 卷密码不匹配导致后端 500
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: fitmate
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema_mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-123456}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: fitmate-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-123456}@db:3306/fitmate?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-fitmate-dev-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-fitmate-jwt-secret}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.6-flash}
      QWEN_API_BASE: ${QWEN_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend/fitmate-frontend
      dockerfile: Dockerfile
      target: development
    container_name: fitmate-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://backend:5000
    volumes:
      - ./frontend/fitmate-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  frontend_node_modules:
